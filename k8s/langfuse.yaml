apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  labels:
    app: holodeck
    component: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holodeck
      component: langfuse
  template:
    metadata:
      labels:
        app: holodeck
        component: langfuse
    spec:
      containers:
        - name: langfuse
          image: langfuse/langfuse:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "postgresql://holodeck:holodeck@postgres:5432/langfuse"
            - name: NEXTAUTH_SECRET
              value: "dev-secret-change-in-production"
            - name: SALT
              value: "dev-salt-change-in-production"
            - name: NEXTAUTH_URL
              value: "http://localhost:3000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  labels:
    app: holodeck
    component: langfuse
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: holodeck
    component: langfuse